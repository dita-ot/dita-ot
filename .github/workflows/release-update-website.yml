name: Release Update Website

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: Tag name
        required: true
  workflow_run:
    workflows: ["Release"]
    types:
      - completed

jobs:
  update-website:
    if: github.repository == 'dita-ot/dita-ot' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Set tag name
        run: |
          echo "tag=${{ inputs.tag || github.event.workflow_run.head_branch }}" >> $GITHUB_ENV
      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.REPOSITORY_DISPATCH }}
          repository: dita-ot/docs
          event-type: release
          client-payload: '{"dita_ot_version": "${{ env.tag }}", "docs_tag": "${{ env.tag }}"}'
