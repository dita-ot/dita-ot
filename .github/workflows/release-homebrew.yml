name: Release Homebrew

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: Tag name
        required: true
  workflow_run:
    workflows: ["Release"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  homebrew:
    if: github.repository == 'dita-ot/dita-ot' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Set tag name
        run: |
          echo "tag=${{ inputs.tag || github.event.workflow_run.head_branch }}" >> $GITHUB_ENV
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@2026.08.14.1
      - name: Update formula locally
        run: |
          download_url="https://github.com/dita-ot/dita-ot/releases/download/${{ env.tag }}/dita-ot-${{ env.tag }}.zip"
          sha256=$(curl -sL "$download_url" | shasum -a 256 | cut -d' ' -f1)
          brew tap-new --no-git dita-ot/ci
          formula_path="$(brew --repository)/Library/Taps/dita-ot/homebrew-ci/Formula/dita-ot.rb"
          curl -sL -o "$formula_path" https://raw.githubusercontent.com/Homebrew/homebrew-core/HEAD/Formula/d/dita-ot.rb
          sed -i -E "s|^([[:space:]]*url \").*(\")\$|\1${download_url}\2|" "$formula_path"
          sed -i -E "s|^([[:space:]]*sha256 \")[0-9a-f]+(\")\$|\1${sha256}\2|" "$formula_path"
          sed -i -E 's|^([[:space:]]*)depends_on "openjdk"|\1depends_on "openjdk@17"|' "$formula_path"
      - name: Build formula from source
        run: brew install --build-from-source dita-ot/ci/dita-ot
        env:
          HOMEBREW_NO_INSTALL_FROM_API: 1
      - name: Test formula
        run: brew test dita-ot/ci/dita-ot
      - name: Audit formula
        run: brew audit --strict dita-ot/ci/dita-ot
        env:
          HOMEBREW_NO_INSTALL_FROM_API: 1
      - name: Create pull-request
        uses: mislav/bump-homebrew-formula-action@v4.2
        with:
          formula-name: dita-ot
          tag-name: ${{ env.tag }}
          base-branch: main
          download-url: https://github.com/dita-ot/dita-ot/releases/download/${{ env.tag }}/dita-ot-${{ env.tag }}.zip
          commit-message: |
            {{formulaName}} {{version}}

            Created via GitHub Action
            
            -----
  
            - [x] Have you followed the [guidelines for contributing](https://github.com/Homebrew/homebrew-core/blob/HEAD/CONTRIBUTING.md)?
            - [x] Have you ensured that your commits follow the [commit style guide](https://docs.brew.sh/Formula-Cookbook#commit)?
            - [x] Have you checked that there aren't other open [pull requests](https://github.com/Homebrew/homebrew-core/pulls) for the same formula update/change?
            - [x] Have you built your formula locally with `HOMEBREW_NO_INSTALL_FROM_API=1 brew install --build-from-source <formula>`?
            - [x] Is your test running fine `brew test <formula>`?
            - [x] Does your build pass `brew audit --strict <formula>` (after doing `HOMEBREW_NO_INSTALL_FROM_API=1 brew install --build-from-source <formula>`)? If this is a new formula, does it pass `brew audit --new <formula>`?
              
            -----
            
            - [x] I did not use AI/LLM to create this PR, or I disclosed the tool/model below and reviewed its output; I did not attribute commits to AI and will answer maintainer questions and review comments myself without AI/LLM.
                      
            -----
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_COMMITTER_TOKEN }}
