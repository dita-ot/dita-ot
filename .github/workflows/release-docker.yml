name: Release Docker

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: Tag name
        required: true
  workflow_run:
    workflows: ["Release"]
    types:
      - completed

permissions:
  contents: write
  packages: write

jobs:
  # Build DITA-OT Docker image and deploy to ghcr.io
  docker:
    if: github.repository == 'dita-ot/dita-ot' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Set tag name
        run: |
          echo "tag=${{ inputs.tag || github.event.workflow_run.head_branch }}" >> $GITHUB_ENV
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.tag }}
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ditaotbot
          password: ${{ secrets.PACKAGE_REGISTRY }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/dita-ot/dita-ot:${{ env.tag }}
          build-args: VERSION=${{ env.tag }}
